# ============================================
# APPLICATION INFO
# ============================================
quarkus.application.name=credit-approval-mcp
quarkus.application.version=1.0-SNAPSHOT

# ============================================
# HTTP SERVER CONFIGURATION
# Run the MCP server on a different port than the credit approval service
# ============================================
quarkus.http.port=8082
quarkus.http.host=0.0.0.0

# ============================================
# MCP SERVER CONFIGURATION
# ============================================
quarkus.mcp.server.server-info.name=NeuralBank Credit Approval Service MCP
quarkus.mcp.server.server-info.version=1.0.0

# Enable traffic logging for debugging
quarkus.mcp.server.traffic-logging.enabled=true
quarkus.mcp.server.traffic-logging.text-limit=100

# ============================================
# REST CLIENT CONFIGURATION - CREDIT APPROVAL SERVICE
# ============================================
# Point to the actual NeuralBank Credit Approval Service API
quarkus.rest-client."creditapprovalclient".uri=http://credit-approval-service.neural-bank-demo.svc.cluster.local

# Enable detailed logging for REST client
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=100

# Follow HTTP redirects
quarkus.rest-client.follow-redirects=true

# Connection timeout (in milliseconds)
quarkus.rest-client."creditapprovalclient".connect-timeout=5000

# Read timeout (in milliseconds)
quarkus.rest-client."creditapprovalclient".read-timeout=10000

# ============================================
# LOGGING CONFIGURATION
# ============================================
# Global log level
quarkus.log.level=INFO

# Specific log levels for debugging
quarkus.log.category."com.neuralbank".level=DEBUG
quarkus.log.category."io.quarkiverse.mcp".level=DEBUG
quarkus.log.category."org.jboss.resteasy.reactive.client".level=DEBUG

# Console logging
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.color=true

# ============================================
# DEVELOPMENT MODE CONFIGURATION
# ============================================
%dev.quarkus.http.port=8082
%dev.quarkus.rest-client."creditapprovalclient".uri=http://localhost:8081
%dev.quarkus.log.console.color=true

# Live reload
%dev.quarkus.live-reload.instrumentation=true

# ============================================
# HEALTH CHECK CONFIGURATION
# ============================================
quarkus.health.extensions.enabled=true
quarkus.smallrye-health.root-path=/q/health

# ============================================
# SWAGGER/OPENAPI CONFIGURATION (Optional)
# ============================================
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ============================================
# CORS CONFIGURATION (if needed for web clients)
# ============================================
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# ============================================
# JSON CONFIGURATION
# ============================================
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non-null

# ============================================
# BANNER CONFIGURATION
# ============================================
quarkus.banner.enabled=true

# ============================================
# OPENSHIFT CONFIGURATION
# ============================================
quarkus.kubernetes.deployment-target=openshift
quarkus.openshift.route.expose=false
quarkus.openshift.name=credit-approval-mcp

# PORT
quarkus.openshift.ports.http.container-port=8082

# HEALTH CHECKS
quarkus.health.extensions.enabled=true
quarkus.smallrye-health.root-path=/q/health

# RESOURCES
quarkus.openshift.resources.requests.memory=256Mi
quarkus.openshift.resources.requests.cpu=250m
quarkus.openshift.resources.limits.memory=512Mi
quarkus.openshift.resources.limits.cpu=500m

