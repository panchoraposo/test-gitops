# Configuración de la aplicación
quarkus.application.name=credit-approval-service
quarkus.application.version=1.0.0

# Configuración del servidor
quarkus.http.port=8081
quarkus.http.host=0.0.0.0


# ENVIRONMENT: inject DB config from ConfigMap and Secret
# ConfigMap provides: DATABASE_URL, DATABASE_USER
quarkus.openshift.env.configmaps=neuralbank-postgresql-config
# Secret provides: key 'password' mapped to env var DATABASE_PASSWORD
quarkus.openshift.env.vars.DATABASE_PASSWORD.value-from.secret=neuralbank-postgresql-secret
quarkus.openshift.env.vars.DATABASE_PASSWORD.value-from.secret-key=password

# Configuración de la base de datos PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/neuralbank}
quarkus.datasource.username=${DATABASE_USER:neuralbank}
quarkus.datasource.password=${DATABASE_PASSWORD:neuralbank123!}

# Configuración de Hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.mapping.format.global=ignore

# Configuración de OpenAPI/Swagger
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=NeuralBank Credit Approval Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Microservicio de aprobación de créditos para NeuralBank
mp.openapi.extensions.smallrye.info.contact.email=dev@neuralbank.com
mp.openapi.extensions.smallrye.info.contact.name=NeuralBank Development Team

# Configuración de Health Check
quarkus.smallrye-health.enabled=true

# Configuración de logs
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.category."com.neuralbank".level=DEBUG

# Configuración de CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# Configuración de JSON
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.write-dates-as-timestamps=false

# Configuración de test
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# OPENSHIFT CONFIGURATION
quarkus.kubernetes.deployment-target=openshift
quarkus.openshift.route.expose=false 
quarkus.openshift.name=credit-approval-service

# PORT
quarkus.openshift.ports.http.container-port=8081

# HEALTH CHECKS
quarkus.health.extensions.enabled=true
quarkus.smallrye-health.root-path=/q/health

# RESOURCES
quarkus.openshift.resources.requests.memory=256Mi
quarkus.openshift.resources.requests.cpu=250m
quarkus.openshift.resources.limits.memory=512Mi
quarkus.openshift.resources.limits.cpu=500m

